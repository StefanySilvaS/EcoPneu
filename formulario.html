<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Agendar Coleta - EcoPneu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>📋 Agendar Coleta</h1>

    <input type="text" id="nome" placeholder="Nome completo">
    <input type="text" id="endereco" placeholder="Endereço">
    <input type="date" id="data">
    <input type="number" id="quantidade" placeholder="Quantidade de pneus">
    <select id="tipo">
      <option>Carro</option>
      <option>Moto</option>
      <option>Caminhão</option>
    </select>

    <button onclick="agendarColeta()">🚛 Agendar coleta</button>
    <button onclick="window.location.href='index.html'">⬅️ Voltar</button>

    <p id="mensagem"></p>

    <h2>📜 Histórico</h2>
    <div id="historico"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
