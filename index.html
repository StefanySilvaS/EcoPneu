<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoPneu</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #e0f7e9;
  margin: 0;
  padding: 0;
  font-size: 16px;
}

.container {
  width: 95%;
  max-width: 650px;
  margin: 20px auto;
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 0 20px rgba(0,0,0,0.15);
  text-align: center;
}

h1 {
  color: #2ecc71;
  font-size: 28px;
}

h2 {
  margin-top: 25px;
  color: #333;
  font-size: 22px;
}

p {
  color: #444;
}

.form-card {
  width: 100%;
  max-width: 300px;
  margin: 0 auto 20px auto;
  background: #f0f9f4;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
}

input, select, button {
  width: 100%;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
  margin-top: 16px;
  box-sizing: border-box;
}

button {
  background: #2ecc71;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  transition: all 0.2s ease;
  border-radius: 12px;
}

button:hover { background: #27ae60; }
button:active {
  transform: scale(0.97);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

#mensagem {
  margin-top: 15px;
  font-weight: bold;
  color: #2ecc71;
  font-size: 16px;
  background: #eafaf1;
  padding: 12px;
  border-radius: 8px;
  animation: aparecer 0.5s ease;
}

.item-historico {
  background: #f0f9f4;
  padding: 12px;
  margin-top: 12px;
  border-radius: 10px;
  text-align: left;
  font-size: 14px;
  border-left: 5px solid #2ecc71;
}

.detalhe {
  display: none;
  margin-top: 10px;
  background: #f0f9f4;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  text-align: left;
}

.etapas-container {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 20px;
}

.etapa {
  background: #eafaf1;
  padding: 20px;
  border-left: 6px solid #2ecc71;
  border-radius: 10px;
  text-align: left;
  font-size: 16px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
  transition: transform 0.2s;
}

.etapa h3 {
  font-size: 24px;
  margin-bottom: 8px;
}

.etapa p {
  margin-top: 5px;
  font-size: 16px;
  color: #444;
}

.etapa button {
  margin-top: 12px;
  padding: 14px;
  width: 100%;
  background: #27ae60;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
}

.etapa button:hover {
  background: #1e8449;
  transform: translateY(-2px);
}

.etapa button:active {
  transform: scale(0.96);
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

@keyframes aparecer {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

#formulario { animation: aparecer 0.5s ease; }

@media (max-width: 480px) {
  .container { padding: 25px; }
  h1 { font-size: 24px; }
  h2 { font-size: 20px; }
  input, select, button { font-size: 15px; padding: 14px; }
}
</style>
</head>
<body>

<div class="container">

<h1>🌱 EcoPneu</h1>

<div id="formulario" class="form-card">
  <h2>📋 Agendar Coleta</h2>
  <input type="text" id="nome" placeholder="Nome completo">
  <input type="text" id="endereco" placeholder="Endereço">
  <input type="date" id="data">
  <input type="number" id="quantidade" placeholder="Quantidade de pneus">
  <select id="tipo">
    <option value="">Selecione tipo</option>
    <option value="Carro">Carro</option>
    <option value="Moto">Moto</option>
    <option value="Caminhão">Caminhão</option>
  </select>
  <button onclick="agendarColeta()">🚛 Agendar coleta</button>
  <p id="mensagem"></p>
</div>

<h2>♻️ Etapas da Reciclagem</h2>
<div class="etapas-container">
  <div class="etapa">
    <h3>Coleta</h3>
    <p>Solicitação ou entrega do pneu.</p>
    <button onclick="mostrarDetalhe('coleta')">Como fazer</button>
    <div id="coleta" class="detalhe"></div>
  </div>

  <div class="etapa">
    <h3>Recebimento</h3>
    <p>Armazenamento seguro.</p>
    <button onclick="mostrarDetalhe('recebimento')">Como funciona</button>
    <div id="recebimento" class="detalhe"></div>
  </div>

  <div class="etapa">
    <h3>Triagem</h3>
    <p>Separação dos pneus.</p>
    <button onclick="mostrarDetalhe('triagem')">Ver detalhes</button>
    <div id="triagem" class="detalhe"></div>
  </div>

  <div class="etapa">
    <h3>Transporte</h3>
    <p>Envio para reciclagem.</p>
    <button onclick="mostrarDetalhe('transporte')">Como funciona</button>
    <div id="transporte" class="detalhe"></div>
  </div>

  <div class="etapa">
    <h3>Reciclagem</h3>
    <p>Transformação em novos produtos.</p>
    <button onclick="mostrarDetalhe('reciclagem')">Ver resultado</button>
    <div id="reciclagem" class="detalhe"></div>
  </div>
</div>

<h2>📜 Histórico</h2>
<div id="historico"></div>
<button style="margin-top:12px; background:#e74c3c;" onclick="apagarHistorico()">🗑️ Apagar Histórico</button>

</div>
<button onclick="apagarHistorico()" style="margin-top:12px; background:#e74c3c;">🗑️ Apagar histórico</button>
<script>
function agendarColeta() {
  let nome = document.getElementById("nome").value;
  let quantidade = document.getElementById("quantidade").value;
  let tipo = document.getElementById("tipo").value;
  let endereco = document.getElementById("endereco").value;
  let data = document.getElementById("data").value;

  if (nome === "" || quantidade === "" || endereco === "" || data === "" || tipo === "") {
    alert("⚠️ Preencha todos os campos!");
    return;
  }

  let mensagemDiv = document.getElementById("mensagem");
  mensagemDiv.innerHTML = "✅ Coleta agendada com sucesso!";
  mensagemDiv.style.animation = "aparecer 0.5s ease";

  let novaColeta = { nome, quantidade, tipo, endereco, data };
  let historico = JSON.parse(localStorage.getItem("historico")) || [];
  historico.push(novaColeta);
  localStorage.setItem("historico", JSON.stringify(historico));

  mostrarHistorico();

  document.getElementById("nome").value = "";
  document.getElementById("quantidade").value = "";
  document.getElementById("tipo").value = "";
  document.getElementById("endereco").value = "";
  document.getElementById("data").value = "";
}

function mostrarHistorico() {
  let historico = JSON.parse(localStorage.getItem("historico")) || [];
  let div = document.getElementById("historico");
  div.innerHTML = "";

  historico.forEach((item) => {
    div.innerHTML += `
      <div class="item-historico">
        <strong>${item.nome}</strong> - ${item.quantidade} pneus (${item.tipo})<br>
        📍 ${item.endereco}<br>
        📅 ${item.data}
      </div>
    `;
  });
}

function apagarHistorico() {
  if(confirm("⚠️ Tem certeza que deseja apagar todo o histórico?")) {
    localStorage.removeItem("historico");
    mostrarHistorico();
  }
}

function mostrarDetalhe(etapa) {
  let div = document.getElementById(etapa);
  if (!div) return;

  if (div.style.display === "block") {
    div.style.display = "none";
    return;
  }

  let textos = {
    coleta: `
  <strong>📍 Onde coletar:</strong><br>
  - Borracharias parceiras<br>
  - Pontos de coleta municipais<br>
  - Empresas de logística reversa<br><br>
  <img src="imagens/coleta1.jpg" alt="Borracharias" style="width:100%; border-radius:10px; margin-top:8px;">
  <img src="imagens/coleta2.jpg" alt="Pontos de coleta" style="width:100%; border-radius:10px; margin-top:8px;">
`,
    recebimento: `
      <strong>🏭 Recebimento e armazenamento:</strong><br>
      - Pneus armazenados em galpões seguros<br>
      - Evita acúmulo de água e mosquitos<br><br>
      <img src="imagens/recebimento1.jpg" alt="Armazenamento seguro" style="width:100%; border-radius:10px; margin-top:8px;">
    `,
    triagem: `
      <strong>🔍 Triagem:</strong><br>
      - Pneus em bom estado → reutilização<br>
      - Pneus danificados → reciclagem<br>
      - Destino correto evita impacto ambiental<br><br>
      <img src="imagens/triagem1.jpg" alt="Triagem de pneus" style="width:100%; border-radius:10px; margin-top:8px;">
    `,
    transporte: `
      <strong>🚚 Transporte:</strong><br>
      - Empresas especializadas transportam os pneus<br>
      - Caminhões ou carretas adequadas<br><br>
      <img src="imagens/transporte1.jpg" alt="Transporte de pneus" style="width:100%; border-radius:10px; margin-top:8px;">
    `,
    reciclagem: `
      <strong>♻️ Produtos reciclados:</strong><br>
      - Pisos de borracha<br>
      - Asfalto ecológico<br>
      - Brinquedos ou mobiliário urbano<br><br>
      <img src="imagens/reciclagem1.jpg" alt="Produtos reciclados" style="width:100%; border-radius:10px; margin-top:8px;">
    `
  };

  div.innerHTML = textos[etapa];
  div.style.display = "block";
}

window.onload = function () {
  mostrarHistorico();
};
</script>

</body>
</html>
