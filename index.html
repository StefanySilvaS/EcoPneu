<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoPneu</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #e0f7e9;
  margin: 0;
  padding: 0;
  font-size: 16px;
}

.container {
  width: 95%;
  max-width: 650px;
  margin: 20px auto;
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 0 20px rgba(0,0,0,0.15);
  text-align: center;
}

h1 {
  color: #2ecc71;
  font-size: 28px;
}

h2 {
  margin-top: 25px;
  color: #333;
  font-size: 22px;
}

.form-card {
  width: 100%;
  max-width: 300px;
  margin: 0 auto 20px auto;
  background: #f0f9f4;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
}

input, select, button {
  width: 100%;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
  margin-top: 16px;
  box-sizing: border-box;
}

button {
  background: #2ecc71;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
  border-radius: 12px;
}

button:hover { background: #27ae60; }

#mensagem {
  margin-top: 15px;
  font-weight: bold;
  color: #2ecc71;
  background: #eafaf1;
  padding: 12px;
  border-radius: 8px;
}

.item-historico {
  background: #f0f9f4;
  padding: 12px;
  margin-top: 12px;
  border-radius: 10px;
  text-align: left;
  font-size: 14px;
  border-left: 5px solid #2ecc71;
}

#btn-apagar {
  background: #e74c3c;
  margin-top: 15px;
}

#btn-apagar:hover {
  background: #c0392b;
}
</style>

</head>
<body>

<div class="container">

<h1>🌱 EcoPneu</h1>

<div id="formulario" class="form-card">
  <h2>📋 Agendar Coleta</h2>

  <input type="text" id="nome" placeholder="Nome completo">

  <input type="text" id="cep" placeholder="CEP" onblur="buscarCEP()">
  <input type="text" id="rua" placeholder="Rua">
  <input type="text" id="numero" placeholder="Número">
  <input type="text" id="bairro" placeholder="Bairro">
  <input type="text" id="cidade" placeholder="Cidade">

  <input type="date" id="data">
  <input type="number" id="quantidade" placeholder="Quantidade de pneus">

  <select id="tipo">
    <option value="">Selecione tipo</option>
    <option value="Carro">Carro</option>
    <option value="Moto">Moto</option>
    <option value="Caminhão">Caminhão</option>
  </select>

  <button onclick="agendarColeta()">🚛 Agendar coleta</button>
  <p id="mensagem"></p>
</div>

<h2>📜 Histórico</h2>
<div id="historico"></div>

<button id="btn-apagar" onclick="apagarHistorico()">
  🗑️ Apagar histórico
</button>

</div>

<script>

// BUSCAR CEP 🔥
function buscarCEP() {
  let cep = document.getElementById("cep").value.replace(/\D/g, "");

  if (cep.length !== 8) {
    alert("CEP inválido!");
    return;
  }

  fetch(`https://viacep.com.br/ws/${cep}/json/`)
    .then(res => res.json())
    .then(dados => {
      if (dados.erro) {
        alert("CEP não encontrado!");
        return;
      }

      document.getElementById("rua").value = dados.logradouro;
      document.getElementById("bairro").value = dados.bairro;
      document.getElementById("cidade").value = dados.localidade;
    })
    .catch(() => alert("Erro ao buscar CEP"));
}

// AGENDAR
function agendarColeta() {
  let nome = document.getElementById("nome").value;
  let cep = document.getElementById("cep").value;
  let rua = document.getElementById("rua").value;
  let numero = document.getElementById("numero").value;
  let bairro = document.getElementById("bairro").value;
  let cidade = document.getElementById("cidade").value;
  let data = document.getElementById("data").value;
  let quantidade = document.getElementById("quantidade").value;
  let tipo = document.getElementById("tipo").value;

  if (!nome || !cep || !rua || !numero || !bairro || !cidade || !data || !quantidade || !tipo) {
    alert("⚠️ Preencha todos os campos!");
    return;
  }

  let endereco = `${rua}, ${numero} - ${bairro}, ${cidade} (${cep})`;

  let novaColeta = { nome, quantidade, tipo, endereco, data };

  let historico = JSON.parse(localStorage.getItem("historico") || "[]");

  historico.push(novaColeta);

  localStorage.setItem("historico", JSON.stringify(historico));

  mostrarHistorico();

  document.getElementById("mensagem").innerHTML = "✅ Coleta agendada com sucesso!";

  // limpar campos
  document.getElementById("nome").value = "";
  document.getElementById("cep").value = "";
  document.getElementById("rua").value = "";
  document.getElementById("numero").value = "";
  document.getElementById("bairro").value = "";
  document.getElementById("cidade").value = "";
  document.getElementById("data").value = "";
  document.getElementById("quantidade").value = "";
  document.getElementById("tipo").value = "";
}

// MOSTRAR HISTÓRICO
function mostrarHistorico() {
  let historico = JSON.parse(localStorage.getItem("historico") || "[]");
  let div = document.getElementById("historico");

  div.innerHTML = "";

  historico.forEach((item) => {
    div.innerHTML += `
      <div class="item-historico">
        <strong>${item.nome}</strong> - ${item.quantidade} pneus (${item.tipo})<br>
        📍 ${item.endereco}<br>
        📅 ${item.data}
      </div>
    `;
  });
}

// APAGAR HISTÓRICO
function apagarHistorico() {
  let confirmar = confirm("Tem certeza que deseja apagar todo o histórico?");

  if (confirmar) {
    localStorage.removeItem("historico");
    mostrarHistorico();
  }
}

// CARREGAR
window.onload = function () {
  mostrarHistorico();
};

</script>

</body>
</html>
